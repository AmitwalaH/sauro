name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --all

  bench:
    name: bench checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stdlib only, so the runner's own python3 is enough.
      - name: every evidence span is in its cited page
        run: python3 bench/tools/check_fixtures.py

      - name: tests for the fixture check
        run: python3 -m unittest bench/tools/test_check_fixtures.py

      # Network is a local server on 127.0.0.1. No test fetches a real URL.
      - name: tests for the source fetcher
        run: python3 -m unittest bench/tools/test_fetch_sources.py

  docs:
    name: docs checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The method bans em dashes in files we write. Catch them before review does.
      # Matches the raw UTF-8 bytes of U+2014 so it works on any grep. A PCRE
      # \x{2014} pattern errors on greps built without Unicode support, and the
      # error reads as a pass. Found that the hard way on 2026-11-01.
      - name: no em dashes in markdown
        run: |
          if grep -rn --include='*.md' $'\xe2\x80\x94' . ; then
            echo "em dash found; the method asks for plain hyphens or rewording"
            exit 1
          fi
          echo "no em dashes"
